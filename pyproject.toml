[project]
name = "boneid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jeremy wong", email = "jeremydwong@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "meshcat>=0.3.2",
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
]

[project.scripts]
boneid = "boneid:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter-core>=5.9.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "playwright>=1.62.0",
]
